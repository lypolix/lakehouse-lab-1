name: lakehouse-lab-1

services:
  minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  pg:
    image: postgres:17
    container_name: lakehouse-pg
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    command: serve
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@pg:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@pg:5432/postgres"
    ports:
      - "8181:8181"
    depends_on:
      pg:
        condition: service_healthy

  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8080:8080"
    mem_limit: 5g
    volumes:
      - ./catalog:/etc/trino/catalog
      - ./etc/jvm.config:/etc/trino/jvm.config:ro
      - ./etc/config.properties:/etc/trino/config.properties:ro
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    depends_on:
      - lakekeeper
      - minio

  mc:
    image: pgsty/mc:latest
    profiles: ["tools"]
    entrypoint: [""]
    depends_on:
      - minio

  spark:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./scripts:/opt/lab/scripts:ro
      - ./results:/opt/lab/results
    entrypoint: [""]
    depends_on:
      - lakekeeper

volumes:
  minio-data:
  pg-data:
